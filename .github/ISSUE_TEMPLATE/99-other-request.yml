name: "其它问题 / Other issue"
description: "现有分类都不适用时，使用结构化表单说明情况 / Use this structured form when no existing category fits"
title: "[Other] "
labels:
  - "type: other"
  - "status: needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        请先确认错误报告、功能建议、使用与安装问题以及扩展与 Agent 资产表单都不适用。安全漏洞不要使用此表单，请通过仓库 Security 页面私密报告。

        First confirm that the bug, feature, usage and installation, and extension or Agent asset forms do not fit. Do not use this form for security vulnerabilities; report them privately through the repository Security page.
  - type: input
    id: topic
    attributes:
      label: "主题 / Topic"
      description: "用一句话说明你想讨论或报告什么 / Summarize what you want to discuss or report in one sentence"
    validations:
      required: true
  - type: textarea
    id: why-other
    attributes:
      label: "为什么现有入口不适用？ / Why do the existing forms not fit?"
      description: "说明它为什么不是错误、功能建议、使用问题或扩展与 Agent 资产建议 / Explain why this is not a bug, feature request, usage question, or extension/Agent asset request"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: "详细情况 / Details"
      description: "提供维护者理解和分流所需的事实、背景与期望结果 / Provide the facts, context, and desired outcome needed for maintainer triage"
    validations:
      required: true
  - type: textarea
    id: checked
    attributes:
      label: "已经检查过什么？ / What have you checked?"
      description: "可选。列出查过的文档、Issue、代码或其它资料 / Optional. List documentation, issues, code, or other material you checked"
  - type: textarea
    id: additional-context
    attributes:
      label: "补充材料 / Additional context"
      description: "可选。添加脱敏截图、日志片段或相关链接 / Optional. Add redacted screenshots, log excerpts, or related links"
  - type: dropdown
    id: pr-intent
    attributes:
      label: "是否愿意实现并提交 PR？ / Do you plan to implement and submit a PR?"
      description: "选择“愿意”后，请等待维护者授权再开始，避免重复实现。 / If you plan to implement, wait for maintainer authorization before starting."
      options:
        - "愿意，会等待维护者授权 / Yes, I'll wait for maintainer authorization"
        - "愿意，但需要维护者引导 / Willing, but need maintainer guidance"
        - "仅报告，不计划实现 / Reporting only, no implementation planned"
    validations:
      required: true
  - type: checkboxes
    id: privacy-confirmation
    attributes:
      label: "隐私确认 / Privacy confirmation"
      options:
        - label: "我确认公开内容不含 API Key、Token、私人信息、完整会话、未授权内容或其它敏感信息。 / I confirm that the public content contains no API keys, tokens, private data, complete sessions, unlicensed content, or other sensitive information."
          required: true
  - type: checkboxes
    id: duplicate-check
    attributes:
      label: "重复问题 / Duplicate check"
      options:
        - label: "我搜索过文档和现有 Issue，没有找到相同问题或请求。 / I searched the documentation and existing issues and did not find the same issue or request."
          required: true
