name: "功能建议 / Feature request"
description: "描述需要解决的问题和期望结果 / Describe a problem to solve and the outcome you need"
title: "[Feature] "
labels:
  - "type: feature"
  - "status: needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        请先描述真实问题，不需要提前设计完整技术方案。复杂或跨边界需求会先讨论能否缩小范围。

        Start with the real problem; you do not need to design the full technical solution. Complex or cross-boundary requests may first be reduced to a smaller scope.
  - type: textarea
    id: problem
    attributes:
      label: "你遇到了什么问题？ / What problem are you facing?"
      description: "描述使用场景、阻碍和发生频率 / Describe the scenario, obstacle, and how often it matters"
    validations:
      required: true
  - type: textarea
    id: desired-outcome
    attributes:
      label: "期望结果 / Desired outcome"
      description: "完成后你应该能做什么，不必限定界面或实现方式 / What should become possible, without prescribing the UI or implementation"
    validations:
      required: true
  - type: textarea
    id: current-workaround
    attributes:
      label: "当前绕行方式 / Current workaround"
      description: "现在如何完成这件事？没有可写“无” / How do you handle it today? Write “none” if there is no workaround"
    validations:
      required: true
  - type: dropdown
    id: target-users
    attributes:
      label: "主要使用者 / Primary audience"
      options:
        - "本地信息用户 / Local information users"
        - "Source 或 Connector 开发者 / Source or connector developers"
        - "Flow、Action 或 Agent 开发者 / Flow, action, or Agent developers"
        - "看板、Artifact 或 Workspace 使用者 / Board, artifact, or workspace users"
        - "维护者和运维人员 / Maintainers and operators"
        - "多类用户 / Multiple groups"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "备选方案与取舍 / Alternatives and tradeoffs"
      description: "可选。你考虑过哪些更小或不同的方案？ / Optional. What smaller or different approaches have you considered?"
  - type: textarea
    id: additional-context
    attributes:
      label: "补充材料 / Additional context"
      description: "可选。可以提供脱敏后的示例、草图或相关链接 / Optional. Add redacted examples, sketches, or related links"
  - type: dropdown
    id: pr-intent
    attributes:
      label: "是否愿意实现并提交 PR？ / Do you plan to implement and submit a PR?"
      description: "选择“愿意”后，请等待维护者授权（添加 status: claimed 标签）再开始。 / If you plan to implement, wait for maintainer authorization before starting."
      options:
        - "愿意，会等待维护者授权 / Yes, I'll wait for maintainer authorization"
        - "愿意，但需要维护者引导 / Willing, but need maintainer guidance"
        - "仅报告，不计划实现 / Reporting only, no implementation planned"
    validations:
      required: true
  - type: checkboxes
    id: privacy-confirmation
    attributes:
      label: "隐私确认 / Privacy confirmation"
      options:
        - label: "我确认补充材料不含 API Key、私人信息、未授权内容或其它敏感数据。 / I confirm that the material contains no API keys, private data, unlicensed content, or other sensitive data."
          required: true
  - type: checkboxes
    id: duplicate-check
    attributes:
      label: "重复建议 / Duplicate check"
      options:
        - label: "我搜索过现有 Issue，没有找到相同建议。 / I searched existing issues and did not find the same request."
          required: true
