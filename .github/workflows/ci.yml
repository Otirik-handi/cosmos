name: CI

on:
    push:
        branches: [master]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: cosmos-ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    # 与生成/更新 bun.lock 的工具链对齐；不同 bun 版本为 workspace 依赖生成的
    # node_modules 布局不同。Prisma CLI 的位置不再由调用方假定（见
    # packages/storage-prisma/src/prisma-cli.ts），版本对齐只用于避免锁文件漂移。
    BUN_VERSION: 1.4.2

jobs:
    quality:
        name: Quality
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - run: bun install --frozen-lockfile
            - run: bun run docs:check
            - run: python3 scripts/size-governance.py -c docs --check --baseline docs/doc-governance/docs-baseline.json --fail-on-new
            - run: bun run db:validate
            - run: bun run db:generate
            - run: bun run typecheck
            - run: bun run test
            - run: bun run test:property
            - run: bun run lint:web
            - run: bun run build

    node-e2e:
        name: Node process E2E
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: quality
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - run: bun install --frozen-lockfile
            - run: bun run db:generate
            - run: bun run test:e2e

    browser-e2e:
        name: Browser E2E
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: quality
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - run: bun install --frozen-lockfile
            - run: bun run db:generate
            - run: bunx playwright install --with-deps chromium
            - run: bun run test:browser
            - run: bun run test:browser:component-lab

    windows-smoke:
        name: Windows Node smoke
        runs-on: windows-latest
        timeout-minutes: 30
        needs: quality
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - run: bun install --frozen-lockfile
            - run: bun run db:generate
            - run: bun run build
            - shell: pwsh
              run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-node.ps1
