# 依赖下载源：显式声明为国内镜像（registry.npmmirror.com），与 bun.lock 里已解析的
# 1,026 条地址一致。
#
# 实测结论（2026-09-17，Task 29；两个小工程 + 本仓库锁文件各跑一次）：
# - 锁文件里**已有**条目是粘的：把本文件改成官方源再跑 `bun install --lockfile-only`，
#   1,026 条镜像地址一条都不会变；
# - 本文件决定的是**新解析出来**的包写哪个下载地址：指向 npmmirror 时锁里会写入
#   `https://registry.npmmirror.com/…`；指向官方源时 bun 不写地址（按默认源解析）。
# 也就是说，没有本文件时「新加一个依赖从哪里下」由每台机器的 bun 配置决定，同一条
# 锁文件会随不同人的环境长成混合来源。写在这里 = 把这件事变成仓库决定。
#
# 注意：锁文件里已固化的 1,026 条镜像地址意味着安装必须能访问该镜像（CI 与本机都
# 满足）。若要改为官方源，需要重生成锁文件，并单独做一次安装 + 全量门禁 + E2E 验证。
[install]
registry = "https://registry.npmmirror.com"
